<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>03 Missing Field Form</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; color: #333; }
    fieldset { border: 1px solid #aaa; margin-bottom: 20px; padding: 16px; border-radius: 6px; }
    label { display: block; margin-top: 10px; font-size: 13px; font-weight: 500; }
    input[type="text"], input[type="date"], select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    .required-tag { color: #dc2626; font-size: 12px; }
    button { margin-top: 15px; padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>03 Missing Field Form</h1>
  <form id="missing-field-form">
    <fieldset>
      <legend>Student Information</legend>
      <label for="student-name">Student Full Name</label>
      <input type="text" id="student-name" name="student_name" />

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" />

      <!-- Field intentionally missing from canonical document record -->
      <label for="blood-group">Blood Group <span class="required-tag">*Required</span></label>
      <select id="blood-group" name="blood_group" required>
        <option value="">-- Select Blood Group --</option>
        <option value="A+">A+</option>
        <option value="B+">B+</option>
        <option value="O+">O+</option>
        <option value="AB+">AB+</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Parent Information</legend>
      <label for="father-name">Father Name</label>
      <input type="text" id="father-name" name="father_name" />

      <label for="contact">Primary Contact</label>
      <input type="text" id="contact" name="contact" />
    </fieldset>

    <button type="submit" id="submit-btn" onclick="window.__submitted = true; return false;">
      Submit
    </button>
  </form>
</body>
</html>
