<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>09 File Upload Form</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; color: #1e293b; }
    fieldset { border: 1px solid #cbd5e1; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-size: 13px; font-weight: 500; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>09 Document & File Upload Form</h1>
  <form id="upload-form">
    <fieldset>
      <legend>Student Identity</legend>
      <label for="student-name">Student Full Name</label>
      <input type="text" id="student-name" name="fullName" />

      <label for="student-photo">Student Photo</label>
      <input type="file" id="student-photo" name="photo" accept=".png,.jpg,.jpeg,.docx" />

      <label for="doc-proof">Admission Record / Supporting Document</label>
      <input type="file" id="doc-proof" name="docProof" accept=".pdf,.docx,.xlsx" />
    </fieldset>

    <button type="submit" id="submit-btn" onclick="window.__submitted = true; return false;">
      Upload & Submit Application
    </button>
  </form>
</body>
</html>
