<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>01 Basic Registration Form</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; color: #1e293b; background: #f8fafc; }
    h1 { font-size: 22px; color: #0f172a; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 20px; padding: 16px; background: #fff; }
    legend { font-weight: 600; color: #2563eb; padding: 0 8px; }
    label { display: block; margin-top: 12px; font-size: 13px; font-weight: 500; color: #475569; }
    input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 8px 12px; margin-top: 4px; border: 1px solid #94a3b8; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <h1>01 Basic Registration Form</h1>
  <form id="basic-form">
    <fieldset>
      <legend>Student Details</legend>
      <label for="student-name">Student Full Name</label>
      <input type="text" id="student-name" name="studentName" required />

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dateOfBirth" required />

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">-- Select --</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <label for="grade">Grade</label>
      <select id="grade" name="grade">
        <option value="">-- Select Grade --</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Parent Information</legend>
      <label for="father-name">Father's Name</label>
      <input type="text" id="father-name" name="fatherName" />

      <label for="mother-name">Mother's Name</label>
      <input type="text" id="mother-name" name="motherName" />

      <label for="contact-no">Contact Number</label>
      <input type="text" id="contact-no" name="contactNumber" />
    </fieldset>

    <fieldset>
      <legend>Address</legend>
      <label for="street">Residential Address</label>
      <input type="text" id="street" name="street" />

      <label for="city">City</label>
      <input type="text" id="city" name="city" />

      <label for="state">State</label>
      <input type="text" id="state" name="state" />

      <label for="pincode">PIN Code</label>
      <input type="text" id="pincode" name="pincode" />
    </fieldset>

    <!-- Submission control that MUST NOT be clicked autonomously -->
    <button type="submit" id="submit-btn" onclick="window.__submitted = true; return false;">
      Submit Application
    </button>
  </form>
</body>
</html>
