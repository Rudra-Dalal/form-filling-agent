<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Greenwood High School — Student Registration</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; color: #222; }
  h1 { font-size: 20px; border-bottom: 2px solid #2c5; padding-bottom: 8px; }
  fieldset { border: 1px solid #ccc; margin-bottom: 20px; padding: 16px; }
  legend { font-weight: bold; padding: 0 6px; }
  label { display: block; margin-top: 12px; font-size: 13px; color: #444; }
  input[type="text"], input[type="date"], select {
    width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box;
  }
  .checkbox-row { display: flex; align-items: center; margin-top: 14px; }
  .checkbox-row input { margin-right: 8px; }
  button { margin-top: 20px; padding: 10px 20px; background: #2c5; color: white; border: none; }
</style>
</head>
<body>
  <h1>Greenwood High School — New Student Registration</h1>

  <form id="registration-form">
    <fieldset>
      <legend>Student Details</legend>

      <!-- Deliberately phrased differently from a typical admission document,
           to exercise semantic (not exact-string) label matching. -->
      <label for="full-name">Name of Student</label>
      <input type="text" id="full-name" name="full-name" />

      <label for="birth-date">Date of Birth</label>
      <input type="date" id="birth-date" name="birth-date" />

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">-- Select --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label for="grade">Applying for Grade</label>
      <select id="grade" name="grade">
        <option value="">-- Select --</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Parent / Guardian Details</legend>

      <label for="father-name">Father's Full Name</label>
      <input type="text" id="father-name" name="father-name" />

      <label for="mother-name">Mother's Full Name</label>
      <input type="text" id="mother-name" name="mother-name" />

      <label for="contact">Primary Contact Number</label>
      <input type="text" id="contact" name="contact" />
    </fieldset>

    <fieldset>
      <legend>Address</legend>

      <label for="street">Residential Address</label>
      <input type="text" id="street" name="street" />

      <label for="city">City / Town</label>
      <input type="text" id="city" name="city" />

      <label for="state">State</label>
      <input type="text" id="state" name="state" />

      <label for="pincode">PIN Code</label>
      <input type="text" id="pincode" name="pincode" />
    </fieldset>

    <fieldset>
      <legend>Declaration</legend>
      <div class="checkbox-row">
        <input type="checkbox" id="hosteler" name="hosteler" />
        <label for="hosteler" style="margin:0;">Applying for hostel accommodation</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="confirm" name="confirm" />
        <label for="confirm" style="margin:0;">I confirm the above details are accurate</label>
      </div>
    </fieldset>

    <!-- Deliberately NOT a real submit button that goes anywhere - this is a
         local fixture. Its only purpose is to give the agent something to
         correctly NOT click. -->
    <button type="button" onclick="alert('This fixture form does not actually submit.')">
      Submit Registration
    </button>
  </form>
</body>
</html>
