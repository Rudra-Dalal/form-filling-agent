<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FormFlow</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="window-header">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div>
          <h1>FormFlow</h1>
          <p class="subtitle">Reads your documents. Fills the form. Never submits without you.</p>
        </div>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="engine-status">Local Engine v2.4 &nbsp;|&nbsp; Ready</span>
        <button class="settings-btn" title="Settings">⚙</button>
      </div>
    </header>

    <section class="card" id="document-upload-card"></section>
    <section class="card" id="task-input-card"></section>

    <section class="card" id="agent-status-card"></section>
    <section class="card" id="controls-card"></section>

    <section class="card" id="activity-log-card"></section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
